# One web service replaces the five AWS ECS containers.
# plan: free is required. Omitting it makes Render pick a paid instance.
services:
  - type: keyvalue
    name: nexora-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: nexoraai
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev --prefix backend && npm install --include=dev --prefix frontend && npm run build --prefix frontend
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: REDIS_URL
        fromService:
          name: nexora-redis
          type: keyvalue
          property: connectionString
      - key: AUTH_MONGODB_URI
        sync: false
      - key: CHAT_MONGODB_URI
        sync: false
      - key: BILLING_MONGODB_URI
        sync: false
      - key: AGENT_MONGODB_URI
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      # - key: AWS_REGION
      #   sync: false
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false
      # - key: AWS_SECRET_KEY
      #   sync: false
      # - key: AWS_BUCKET_NAME
      #   sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
